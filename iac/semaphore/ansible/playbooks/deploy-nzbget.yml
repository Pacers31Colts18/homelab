---
- name: Deploy NZBGet
  hosts: "{{ target_hosts | default('nzbget00') }}"
  become: true
  tasks:
    - name: Create app directory
      file:
        path: /opt/nzbget
        state: directory
        mode: "0755"

    - name: Copy docker-compose file
      copy:
        src: ../files/nzbget/docker-compose.yml
        dest: /opt/nzbget/docker-compose.yml
        mode: "0644"

    - name: Stop existing NZBGet container
      command: docker rm -f nzbget
      ignore_errors: true

    - name: Pull images
      command: docker compose pull
      args:
        chdir: /opt/nzbget
      timeout: 600

    - name: Start NZBGet
      command: docker compose up -d
      args:
        chdir: /opt/nzbget
