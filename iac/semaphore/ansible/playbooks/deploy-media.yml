---
- name: Deploy Media Stack
  hosts: "{{ target_hosts | default('nzbget00') }}"
  become: true

  vars:
    stack_dir: /opt/media
    apps:
      - nzbget
      - prowlarr
      - radarr
      - sonarr
      - lidarr
      - bazarr

  tasks:
    - name: Create stack directory
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: directory
        mode: "0755"

    - name: Create per-app config directories
      ansible.builtin.file:
        path: "/opt/docker/{{ item }}/config"
        state: directory
        mode: "0755"
      loop: "{{ apps }}"

    - name: Copy docker-compose file
      ansible.builtin.copy:
        src: ../files/nzbget/docker-compose.yml
        dest: "{{ stack_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Remove legacy standalone NZBGet container (if present)
      ansible.builtin.command: docker rm -f NZBGet
      ignore_errors: true

    - name: Stop existing stack (if running)
      ansible.builtin.command: docker compose down
      args:
        chdir: "{{ stack_dir }}"
      ignore_errors: true

    - name: Pull images
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ stack_dir }}"
      timeout: 600

    - name: Start media stack
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ stack_dir }}"
      environment:
        NZBGET_USER: "{{ nzbget_user }}"
        NZBGET_PASS: "{{ nzbget_pass }}"
