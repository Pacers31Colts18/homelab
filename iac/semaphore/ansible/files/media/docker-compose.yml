services:
  nzbget:
    image: ghcr.io/linuxserver/nzbget:latest
    container_name: NZBGet
    environment:
       PUID: ${PUID}
       PGID: ${PGID}
       TZ: ${TZ}
       NZBGET_USER: ${NZBGET_USER}
       NZBGET_PASS: ${NZBGET_PASS}
    volumes:
      - /opt/docker/nzbget/config:/config
      - media_data:/data
    ports:
      - 6789:6789
    extra_hosts:
      - ultron.local:192.168.4.125
    restart: on-failure:5

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: Prowlarr
    environment:
       PUID: ${PUID}
       PGID: ${PGID}
       TZ: ${TZ}
       PROWLARR__AUTH__METHOD: Forms
       PROWLARR__AUTH__REQUIRED: Enabled
       PROWLARR__AUTH__USERNAME: ${ARR_USER}
       PROWLARR__AUTH__PASSWORD: ${ARR_PASS}
    volumes:
      - /opt/docker/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: Radarr
    environment:
       PUID: ${PUID}
       PGID: ${PGID}
       TZ: ${TZ}
       RADARR__AUTH__METHOD: Forms
       RADARR__AUTH__REQUIRED: Enabled
       RADARR__AUTH__USERNAME: ${ARR_USER}
       RADARR__AUTH__PASSWORD: ${ARR_PASS}
    volumes:
      - /opt/docker/radarr/config:/config
      - media_data:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: Sonarr
    environment:
       PUID: ${PUID}
       PGID: ${PGID}
       TZ: ${TZ}
       SONARR__AUTH__METHOD: Forms
       SONARR__AUTH__REQUIRED: Enabled
       SONARR__AUTH__USERNAME: ${ARR_USER}
       SONARR__AUTH__PASSWORD: ${ARR_PASS}
    volumes:
      - /opt/docker/sonarr/config:/config
      - media_data:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: Lidarr
    environment:
       PUID: ${PUID}
       PGID: ${PGID}
       TZ: ${TZ}
       LIDARR__AUTH__METHOD: Forms
       LIDARR__AUTH__REQUIRED: Enabled
       LIDARR__AUTH__USERNAME: ${ARR_USER}
       LIDARR__AUTH__PASSWORD: ${ARR_PASS}
    volumes:
      - /opt/docker/lidarr/config:/config
      - media_data:/data
    ports:
      - 8686:8686
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: Bazarr
    environment:
       PUID: ${PUID}
       PGID: ${PGID}
       TZ: ${TZ}
       BAZARR__AUTH__METHOD: Forms
       BAZARR__AUTH__REQUIRED: Enabled
       BAZARR__AUTH__USERNAME: ${ARR_USER}
       BAZARR__AUTH__PASSWORD: ${ARR_PASS}
    volumes:
      - /opt/docker/bazarr/config:/config
      - media_data:/data
    ports:
      - 6767:6767
    restart: unless-stopped

volumes:
  media_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_HOST},rw,nfsvers=3"
      device: ":/volume1/data"
